# ==============================================================================
# 推手 · PushLab (pushts.com) 生产环境 Nginx 完整标准配置文件
# 适用环境: Linux (Ubuntu / Debian / CentOS), 1Panel, 宝塔面板 (BT-Panel), Docker
# ==============================================================================

# 1. HTTP 强制跳转 HTTPS (301 永久重定向)
server {
    listen 80;
    listen [::]:80;
    server_name pushts.com www.pushts.com;

    # 允许 ACME Let's Encrypt 证书验证请求通过
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pushlab/dist; # <-- 请修改为服务器上实际 dist 绝对路径
    }

    # 其余所有 HTTP 请求一律 301 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 主服务配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pushts.com www.pushts.com;

    # 网站根目录路径 (指向打包后的 dist 目录)
    root /var/www/pushlab/dist; # <-- 请修改为服务器上实际 dist 绝对路径
    index index.html;

    # --------------------------------------------------------------------------
    # SSL 安全证书配置 (Let's Encrypt 或 Cloudflare Origin 证书)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/nginx/ssl/pushts.com.pem;        # <-- 证书公钥路径
    ssl_certificate_key /etc/nginx/ssl/pushts.com.key;    # <-- 证书私钥路径
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # 基础安全请求头 (Security Headers)
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --------------------------------------------------------------------------
    # Gzip 压缩支持 (提升传输速度与 Core Web Vitals)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 核心服务商 AFF 推荐链接 302 动态跳转与防爬防护
    # 包含 X-Robots-Tag 杜绝搜索引擎抓取传权
    # --------------------------------------------------------------------------
    location ~* ^/go/shenxing/?.*$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 https://wuhan01.shenxingaff.com/#/?code=WUQMrgI8;
    }
    location ~* ^/go/dalao/?.*$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 https://fugui0077.dalaoyunaff.com/#/?code=Wpfk4XD5;
    }
    location ~* ^/go/yunjiexian/?.*$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 https://fugui0077.yunjiexianaff.com/#/?code=qA3LF6hW;
    }
    location ~* ^/go/shandianshu/?.*$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 https://fugui0077.shandianshuaff.com/#/?code=KSByEAn9;
    }
    location ~* ^/go/liulian/?.*$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 https://zyrrz.liulianyunaff.com/#/?code=Y6A1M1MN;
    }
    location ~* ^/go/huanqiuti/?.*$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 302 https://fugui0077.huanqiutiaff.com/#/?code=rJyQn4xG;
    }

    # --------------------------------------------------------------------------
    # 静态资源长期强缓存 (Vite 打包自带 Hash，可缓存 1 年)
    # --------------------------------------------------------------------------
    location ~* .(?:css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # HTML 文件禁用本地缓存 (保证随时更新内容用户立即可见)
    # --------------------------------------------------------------------------
    location ~* .html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # --------------------------------------------------------------------------
    # VuePress SPA 单页路由核心兜底 (解决刷新内页报 404 问题)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 自定义 404 页面
    error_page 404 /404.html;
}
